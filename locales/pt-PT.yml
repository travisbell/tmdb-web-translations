  certifications:
    certification: Classificação etária
    descriptors: Descritores
    meaning: Significado
    movies:
      AU:
        '1':
          meaning: Isento de classificação. Os filmes isentos não podem conter material controverso (ou seja, material que normalmente receberia a classificação M ou superior).
        '2':
          meaning: Geral. O conteúdo tem impacto muito ligeiro.
        '3':
          meaning: Acompanhamento parental recomendado. Não há restrições etárias. O conteúdo tem um impacto ligeiro.
        '4':
          meaning: Recomendado para um público mais maduro. Não há restrições etárias. O conteúdo tem um impacto moderado.
        '5':
          meaning: Acompanhamento obrigatório. Inadequado para menores de 15 anos. Os menores de 15 anos têm de estar acompanhados por um dos pais ou pelo tutor. O conteúdo tem um impacto forte.
        '6':
          meaning: Restrito a pessoas com 18 anos ou mais. Apenas para adultos. O conteúdo tem um impacto elevado.
        '7':
          meaning: Restrito a pessoas com 18 anos ou mais. Os filmes com esta classificação contêm pornografia. A venda e o aluguer de filmes X18+ são proibidos em todos os estados australianos; estes filmes só estão legalmente disponíveis no Território da Capital Australiana e no Território do Norte. No entanto, é legal importar material X18+ destes dois territórios para qualquer estado australiano. O conteúdo é sexualmente explícito.
        '8':
          meaning: Classificação recusada. A venda e o aluguer são proibidos na Austrália; esta proibição também se aplica geralmente à importação, quando o material é inspecionado pela alfândega e considerado suspeito. A visualização privada na Internet não é alvo de fiscalização, e as tentativas de censurar legalmente este material online têm gerado controvérsia. Os filmes recebem a classificação RC quando o conteúdo excede as diretrizes. O conteúdo tem um impacto muito elevado.
      BG:
        '1':
          meaning: Recomendado para crianças.
        '2':
          meaning: Sem restrições etárias.
        '3':
          meaning: Não recomendado para menores de 12 anos.
        '4':
          meaning: Proibido a menores de 16 anos.
        '5':
          meaning: Proibido a menores de 18 anos.
      BR:
        '1':
          meaning: Público em geral. Não expor as crianças a conteúdos potencialmente nocivos.
        '2':
          meaning: Não recomendado para menores de 10 anos. Pode conter violência ou linguagem inadequada para crianças, mesmo que de intensidade reduzida.
        '3':
          meaning: Não recomendado para menores de 12 anos. As cenas podem incluir agressão física, consumo de drogas legais e insinuações sexuais.
        '4':
          meaning: Não recomendado para menores de 14 anos. Pode conter material mais violento, referências sexuais mais fortes e/ou nudez.
        '5':
          meaning: Não recomendado para menores de 16 anos. Cenas de produção, tráfico e/ou consumo de drogas ilícitas, sexo hiper-realista, violência sexual, aborto, tortura, mutilação, suicídio, banalização da violência e pena de morte.
        '6':
          meaning: Não recomendado para menores de 18 anos. Cenas de sexo explícito, incesto, pedofilia, apologia do consumo de drogas ilícitas e violência com forte impacto visual.
      CA:
        '1':
          meaning: Todas as idades.
        '2':
          meaning: 'Acompanhamento parental recomendado. Não há restrições etárias, mas algum material pode não ser adequado para todas as crianças.'
        '3':
          meaning: Os menores de 14 anos têm de estar acompanhados por um adulto.
        '4':
          meaning: 'Os menores de 18 anos têm de estar acompanhados por um adulto. Nas províncias marítimas e em Manitoba, os menores de 14 anos não podem assistir ao filme.'
        '5':
          meaning: 'Entrada restrita a pessoas com 18 anos ou mais. O único objetivo do filme é retratar atividade sexual explícita e/ou violência explícita.'
      CA-QC:
        '0':
          meaning: Sem informação de classificação etária.
        '1':
          meaning: 'Classificação geral – Pode ser visto, alugado ou comprado por pessoas de todas as idades. Se um filme com classificação «G» puder ferir a sensibilidade de crianças com menos de 8 anos, é acrescentada a indicação «Não adequado para crianças pequenas».'
        '2':
          meaning: 'A partir dos 13 anos – Só pode ser visto, alugado ou comprado por pessoas com 13 anos ou mais. Os menores de 13 anos só podem entrar se estiverem acompanhados por um adulto.'
        '3':
          meaning: 'A partir dos 16 anos – Só pode ser visto, alugado ou comprado por pessoas com 16 anos ou mais.'
        '4':
          meaning: 'A partir dos 18 anos – Só pode ser visto, alugado ou comprado por adultos com 18 anos ou mais. Se contiver atividade sexual real e explícita, é acrescentada a indicação «Sexualidade explícita». Nas lojas de vídeo, o filme tem de ser colocado numa sala reservada a adultos.'
      DE:
        '1':
          meaning: Sem restrições etárias.
        '2':
          meaning: 'Não é permitida a entrada a menores de 6 anos.'
        '3':
          meaning: 'É permitida a entrada a pessoas com 12 anos ou mais. As crianças dos 6 aos 11 anos só podem entrar se estiverem acompanhadas por um dos pais ou pelo representante legal.'
        '4':
          meaning: 'É permitida a entrada a pessoas com 16 anos ou mais. Não é permitida a entrada a menores dessa idade.'
        '5':
          meaning: 'Entrada permitida apenas a adultos.'
      DK:
        '0':
          meaning: Sem informação de classificação etária.
        '1':
          meaning: 'Adequado para o público em geral.'
        '2':
          meaning: Não recomendado para menores de 7 anos.
        '3':
          meaning: 'A partir dos 11 anos.'
        '4':
          meaning: 'A partir dos 15 anos.'
        '5':
          meaning: 'Isento de classificação.'
      ES:
        '1':
          meaning: 'Entrada permitida a todas as idades.'
        '2':
          meaning: 'Não recomendado para menores de 7 anos.'
        '3':
          meaning: 'Não recomendado para menores de 12 anos.'
        '4':
          meaning: 'Não recomendado para menores de 16 anos.'
        '5':
          meaning: 'Não recomendado para menores de 18 anos.'
        '6':
          meaning: 'Proibido a menores de 18 anos.'
      FI:
        '1':
          meaning: Para todas as idades.
        '2':
          meaning: Mais de 7 anos.
        '3':
          meaning: Mais de 12 anos.
        '4':
          meaning: Mais de 16 anos.
        '5':
          meaning: Apenas para adultos.
        '6':
          meaning: 'Proibida a distribuição comercial.'
      FR:
        '1':
          meaning: "(Tous publics) Adequado para todos os públicos."
        '2':
          meaning: '(Déconseillé aux moins de 10 ans) Inadequado para menores de 10 anos (classificação utilizada apenas na televisão). No cinema, equivale a «avertissement» (aviso): algumas cenas podem perturbar crianças pequenas e pessoas sensíveis. Em vídeo, equivale a «accord parental» (acompanhamento parental).'
        '3':
          meaning: '(Interdit aux moins de 12 ans) Inadequado para menores de 12 anos ou proibida a entrada no cinema a menores de 12 anos.'
        '4':
          meaning: '(Interdit aux moins de 16 ans) Inadequado para menores de 16 anos ou proibida a entrada no cinema a menores de 16 anos.'
        '5':
          meaning: '(Interdit aux mineurs) Inadequado para menores de 18 anos ou proibida a entrada no cinema a menores de 18 anos.'
      GB:
        '1':
          meaning: 'Entrada permitida a todas as idades. Não contém material inadequado para crianças.'
        '2':
          meaning: 'Entrada permitida a todas as idades, mas algumas cenas podem ser inadequadas para crianças pequenas. Pode conter linguagem ligeiramente ofensiva e referências a sexo ou drogas. Pode conter violência moderada se o contexto a justificar (por exemplo, fantasia).'
        '3':
          meaning: 'Os filmes desta categoria são considerados inadequados para crianças muito pequenas. Os menores de 12 anos só podem entrar se estiverem acompanhados, durante todo o filme, por um adulto com pelo menos 18 anos. Contudo, geralmente não se recomenda que os menores de 12 anos vejam o filme. Pode conter temas adultos, discriminação, drogas leves, palavrões moderados, linguagem forte ocasional, violência moderada, referências sexuais e nudez. A atividade sexual pode ser apresentada de forma breve e discreta. A violência sexual pode ser sugerida ou indicada brevemente.'
        '4':
          meaning: 'Utilizada apenas em formatos domésticos desde 2002. Os filmes classificados como 12A recebem normalmente a classificação 12 nas versões VHS/DVD, salvo se tiver sido acrescentado material que exija uma classificação superior. Os menores de 12 anos não podem alugar nem comprar VHS, DVD, Blu-ray, UMD ou jogos com classificação 12. As diretrizes de conteúdo são idênticas às da classificação 12A.'
        '5':
          meaning: 'Entrada permitida apenas a pessoas com mais de 15 anos. Os menores de 15 anos não podem alugar nem comprar VHS, DVD, Blu-ray, UMD ou jogos com classificação 15, nem assistir no cinema a filmes com esta classificação. Pode conter temas adultos, drogas pesadas, linguagem forte frequente, uso limitado de linguagem muito forte, violência forte, referências sexuais fortes e nudez sem pormenores gráficos. A atividade sexual pode ser retratada, mas sem pormenores explícitos. A violência sexual pode ser mostrada de forma discreta se o contexto a justificar.'
        '6':
          meaning: 'Entrada permitida apenas a adultos. Os menores de 18 anos não podem alugar nem comprar VHS, DVD, Blu-ray, UMD ou jogos com classificação 18, nem assistir no cinema a filmes com esta classificação. Não há limites para a linguagem ofensiva. Geralmente são permitidas drogas pesadas, referências sexuais explícitas e atividade sexual detalhada. Podem ser permitidas cenas de sexo real explícito se o contexto as justificar. Geralmente é permitida violência muito forte, sangrenta e/ou sádica. É permitida violência sexual forte, salvo se for erotizada ou excessivamente gráfica.'
        '7':
          meaning: 'Só pode ser exibido em cinemas para adultos licenciados ou vendido em lojas de artigos sexuais licenciadas, exclusivamente a pessoas com 18 anos ou mais. Os filmes desta categoria são sempre pornografia explícita: material destinado à estimulação sexual, com imagens claras de atividade sexual real, fetichismo forte, imagens animadas explícitas ou atos como penetração tripla simultânea e troca de sémen pela boca. Certo material é frequentemente cortado para obter a classificação R18: não são permitidas imagens explícitas de lesões em conteúdos de BDSM ou de palmadas, urofilia, cenas que sugiram incesto mesmo que encenadas, referências a sexo com menores ou ao desenvolvimento sexual infantil, nem comportamentos agressivos como puxar o cabelo ou cuspir num intérprete. Esta categoria exige mais cortes do que qualquer outra.'
      HU:
        '0':
          meaning: Sem informação de classificação etária.
        '1':
          meaning: Sem restrições etárias.
        '2':
          meaning: 'Não recomendado para menores de 6 anos.'
        '3':
          meaning: 'Não recomendado para menores de 12 anos.'
        '4':
          meaning: 'Não recomendado para menores de 16 anos.'
        '5':
          meaning: 'Não recomendado para menores de 18 anos.'
        '6':
          meaning: 'Restrito a pessoas com 18 anos ou mais, apenas para adultos.'
      IN:
        '0':
          meaning: 'Exibição pública sem restrições em toda a Índia, adequada a todas as idades. Os filmes desta categoria não devem perturbar crianças com mais de 4 anos. Podem conter temas educativos, sociais ou familiares, violência fantasiosa e/ou linguagem ligeiramente ofensiva.'
        '1':
          meaning: 'Entrada permitida a todas as idades, mas recomenda-se que os menores de 12 anos sejam acompanhados por um dos pais, pois o tema ou o conteúdo pode ser intenso ou inadequado para crianças pequenas. Pode conter temas adultos, referências sexuais, cenas de sexo pouco explícitas, violência com breves imagens sangrentas e/ou linguagem grosseira ocasional.'
        '2':
          meaning: 'Restrito a adultos (18 anos ou mais). Os menores de 18 anos não podem comprar nem alugar DVD, VHS ou UMD com classificação A, nem assistir no cinema a filmes com esta classificação. Pode conter temas adultos ou perturbadores, linguagem grosseira frequente, violência brutal com sangue e imagens explícitas, cenas de sexo fortes e/ou abuso de drogas, considerados inadequados para menores.'
      IT:
        '0':
          meaning: Sem informação de classificação etária.
        '1':
          meaning: 'Entrada permitida a todas as idades.'
        '2':
          meaning: 'Não é permitida a entrada a menores de 14 anos.'
        '3':
          meaning: 'Não é permitida a entrada a menores de 18 anos.'
      LT:
        '1':
          meaning: 'Filmes para todas as idades.'
        '2':
          meaning: 'Filmes para espetadores a partir dos 7 anos. Os menores de 7 anos só podem assistir se estiverem acompanhados por um adulto.'
        '3':
          meaning: 'Filmes para espetadores a partir dos 13 anos. Os espetadores dos 7 aos 13 anos só podem assistir se estiverem acompanhados por um adulto.'
        '4':
          meaning: 'Filmes para espetadores a partir dos 16 anos.'
        '5':
          meaning: 'Filmes para espetadores a partir dos 18 anos.'
      MY:
        '0':
          meaning: 'Sem informação de classificação etária.'
        '1':
          meaning: ''
        '2':
          meaning: '(Penjaga 13: «Acompanhamento parental 13») - Os menores de 13 anos só podem entrar se estiverem acompanhados por um adulto. Introduzida em 2006, tornou-se o sistema oficial de classificação de filmes da Malásia em 2008. Em abril de 2012, «PG-13» passou a «P13» para destacar o uso da língua malaia em vez do inglês. A classificação P13 não permite cenas de beijos apaixonados.'
        '3':
          meaning: '(Seram, Ganas: «Violência explícita e horror/terror») - O filme pode conter violência forte, imagens sangrentas ou horror/terror que algumas pessoas considerem ofensivos.'
        '4':
          meaning: ''
        '5':
