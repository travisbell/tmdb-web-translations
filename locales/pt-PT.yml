      AU:
        '1':
          meaning: 'Programação destinada a crianças dos 2 aos 11 anos. As estações comerciais têm de emitir pelo menos 30 minutos de conteúdo com classificação P em cada dia útil e aos fins de semana, a qualquer hora. Não pode haver publicidade durante os programas com classificação P.'
