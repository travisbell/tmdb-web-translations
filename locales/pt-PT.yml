          meaning: 'Recomenda-se acompanhamento parental para os espetadores mais novos. O conteúdo PG pode ser emitido a qualquer hora em canais exclusivamente digitais. Nos restantes canais, só deve ser emitido entre as 8h30 e as 16h00 e entre as 19h00 e as 6h00 nos dias úteis, e entre as 10h00 e as 6h00 aos fins de semana.'
        '5':
