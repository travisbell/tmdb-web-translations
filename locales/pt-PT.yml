          meaning: 'Inadequado para menores de 15 anos. Os programas MA15+ só podem ser emitidos entre as 21h00 e as 5h00, em qualquer dia. É obrigatório apresentar avisos sobre o conteúdo. Alguns filmes R18+ em DVD/Blu-ray são remontados para obter uma classificação MA15+ mais adequada à televisão de acesso livre ou por cabo. Alguns filmes classificados como R18 em DVD foram posteriormente emitidos na televisão australiana como MA15+.'
        '7':
