          Se tiveres dúvidas sobre esta eliminação, podes responder a esta mensagem.
        subject: É um duplicado
      '2':
        message: |-
          Olá,

          Esta é uma mensagem dos moderadores de conteúdo do TMDB. O registo que criaste com o título «%{title}» foi eliminado por não cumprir as nossas [diretrizes para novo conteúdo](https://www.themoviedb.org/bible/new_content).

          Se tiveres dúvidas sobre esta eliminação, podes responder a esta mensagem.
        subject: Não cumpre as nossas diretrizes de conteúdo (amador, etc.)
      '3':
        message: |-
          Olá,

          Esta é uma mensagem dos moderadores de conteúdo do TMDB. O registo que criaste com o título «%{title}» foi eliminado. Este título já existe como série e não é considerado um filme válido. Podes saber mais sobre as nossas diretrizes de conteúdo [aqui](https://www.themoviedb.org/bible/new_content).

          Se tiveres dúvidas sobre esta eliminação, podes responder a esta mensagem.
        subject: É uma série
